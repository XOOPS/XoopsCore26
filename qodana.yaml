version: "1.0"

image: jetbrains/qodana-php:2026.2

profile:
  name: qodana.recommended

php:
  version: "8.4"

# roave/security-advisories is dropped here: it rejects the pinned platform PHP 8.4(.0)
# and only guards installs, which static analysis does not need.
bootstrap: cp composer.json.dist composer.json && composer config platform.php 8.4 && composer remove --dev --no-update roave/security-advisories && composer install --no-interaction --prefer-dist '--ignore-platform-req=ext-*'

exclude:
  - name: All
    paths:
      - xoops_lib/vendor
      - extras
      - upgrade
      - build
