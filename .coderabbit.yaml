# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: >-
  Expert PHP reviewer. Focus on type safety, PSR-12, and security.
  XOOPS Core 2.6 requires PHP 8.4 or later (composer.json.dist), so
  PHP 8.x language features are allowed.

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "xoops_lib/**/*.php"
      instructions: >-
        Code targets PHP 8.4+; do not flag PHP 7.x or 8.0-8.3 compatibility.
        Check for proper use of declare(strict_types=1), self:: for class
        constants, and PSR-12 code style.
    - path: "htdocs/kernel/**/*.php"
      instructions: >-
        Review legacy kernel code for security.
        Check for SQL injection, XSS, and proper input sanitization.
    - path: "tests/**/*.php"
      instructions: >-
        Review test code for proper assertions, test isolation, and edge
        case coverage.
  tools:
    phpcs:
      enabled: true
    phpstan:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000

chat:
  auto_reply: true
